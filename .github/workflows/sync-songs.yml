# Sync songs: scrape Miraheze song pages and publish validated rows to Supabase.
# Runs on schedule and can be triggered manually.
# Uses the PROD environment: set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as Variables, and SUPABASE_SERVICE_ROLE_KEY as a Secret.

name: Sync songs to Supabase

on:
  schedule:
    # 8:00 PM CST (02:00 UTC the following day), every other calendar day.
    - cron: "0 2 */2 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: PROD
    timeout-minutes: 30
    defaults:
      run:
        working-directory: data-pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('data-pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipeline.py

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: song-sync-diagnostics-${{ github.run_id }}
          path: data-pipeline/snapshots/
          if-no-files-found: warn
          retention-days: 14
